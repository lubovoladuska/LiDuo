name: liduo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Local Database & Storage
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path_provider_windows: ^2.3.0
  path: ^1.9.1
  shared_preferences: ^2.5.2
  shared_preferences_windows: ^2.4.1

  # Audio & Speech
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  audioplayers: ^6.1.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  percent_indicator: ^4.2.4

  # Optional AI Integration (BYOK)
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/courses/kazakh_90_days/
    - assets/courses/kazakh_90_days/weeks/
